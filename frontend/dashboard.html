<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Derid Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <button class="theme-toggle" aria-label="Toggle theme" style="position: fixed; top: 20px; right: 40px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="5" fill="currentColor"/>
        <path d="m12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="wrapper">
    <h1>Derid <span class="alt">Dashboard</span></h1>
    <p>Manage and analyze your website crawlability reports.</p>

    <div class="form">
      <input type="text" id="urlInput" placeholder="example.com" />
      <button id="checkBtn">Check</button>
    </div>

    <div class="robots-link">
      <a href="#" id="viewRobotsLink">View robots.txt →</a>
    </div>

    <div id="notice" class="notice"></div>

    <div id="reportContainer" class="report-container" style="display: none;">
      <div id="verdictSection"></div>
      <div id="explanationSection"></div>
      <div id="recommendationsSection"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
